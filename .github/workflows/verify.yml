name: Verify current release (not production approval)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install committed dependency lock
        run: |
          npm run check:release-contract
          npm ci --no-fund
      - name: Preserve dependency lock used by this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-used
          path: package-lock.json
      - name: Dependency advisory gate
        run: npm audit --audit-level=high
      - name: Install real Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Isolated demo build and actual browser smoke tests
        run: npm run verify:release
      - name: Diagnose local prerequisites after failure
        if: failure()
        continue-on-error: true
        run: npm run diagnose:local
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-code-browser-evidence
          include-hidden-files: true
          path: |
            .release
            .diagnostics
            playwright-report
            test-results
  sql-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Docker Official Image mirror avoids Docker Hub's shared-runner pull limit.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: ki_isolated_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ki_local_fixture_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ki_isolated_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: SQL 001-012 and upgrade fixtures (local PostgreSQL, not Supabase HTTP)
        run: node scripts/test-sql-local.mjs
        env:
          KI_SQL_TEST_ALLOW_CREATE: 'yes'
      - name: SQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-local-evidence
          include-hidden-files: true
          path: .sql-test
